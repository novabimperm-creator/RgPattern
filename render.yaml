services:
  - type: web
    name: rgpattern
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /app/data
    disk:
      name: rgpattern-data
      mountPath: /app/data
      sizeGB: 10
